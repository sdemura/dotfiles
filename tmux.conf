# Requires tmux 3.8 for floating panes and theme colors.
# Verify from this repository: python3 tmux/check.py
# Reload: Ctrl-b R.
# Shortcut help: Ctrl-b u (tmux list-keys -N).
# Copy-mode help: tmux list-keys -N -T copy-mode-vi -P ''

# Terminal integration ---------------------------------------------------------

# Advertise tmux capabilities to programs running inside it.
# If the terminfo entry is missing, this repository includes tmux-256color.src.
set -g default-terminal "tmux-256color"
# Fixed slots preserve tmux's defaults and avoid duplicates on reload.
# Cursor-shape support prevents a stuck block cursor after nvim/fzf exit.
set -s terminal-features[10] 'xterm-ghostty:RGB:cstyle'
set -s terminal-features[11] '*256col*:RGB'

# Let Neovim receive Escape and focus changes without delay.
set -s escape-time 0
set -g focus-events on

# Pass through kitty-graphics / sixel escapes for image.nvim and snacks.image.
set -g allow-passthrough on

# OSC 52 clipboard sync. Ghostty requires: clipboard-write = allow
set -g set-clipboard on

# General behavior -------------------------------------------------------------

set -g mouse on
set -g history-limit 50000
set -g display-time 2000
# Prefix-q shows pane numbers briefly. Prefix-Space waits for a key.
set -g display-panes-time 1000

# Start numbering at 1 and renumber windows after a window closes.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Resize using sessions where the window is current. The default window-size
# policy, latest, follows the client with the most recent activity.
set -g aggressive-resize on

# Set the outer terminal title.
set -g set-titles on
set -g set-titles-string "#{session_name} [#{b:pane_current_path} #{window_index} #W]"

# Appearance -------------------------------------------------------------------

# Use the terminal palette so Ghostty's light/dark theme switch also styles tmux.
# Catppuccin Overlay1 gives inactive labels a middle gray in either theme.
set -s dark-theme-light-grey '#8087a2'
set -s light-theme-light-grey '#8c8fa1'

# Keep the bar flat, with bold active labels and colored agent states.
set -g status-style bg=default,fg=default
set -g window-status-style fg=themelightgrey,bg=default
set -g window-status-current-style fg=default,bg=default,bold
set -g window-status-last-style fg=themelightgrey
set -g window-status-activity-style fg=magenta,bold
set -g window-status-bell-style fg=red,bold

set -g pane-border-lines heavy
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=brightblack
# A muted, one-column scrollbar overlays the right edge without resizing panes.
set -g pane-scrollbars-style fg=themelightgrey,bg=default,width=1,pad=0

set -g display-panes-colour "brightblack"
set -g display-panes-active-colour "blue"

# Use the same palette for copy selections, prompts, and menus.
set -g mode-style fg=yellow,bg=default,reverse,bold
# tmux 3.8 overlays prompts on the status bar; fill clears the old labels.
set -g message-style fg=blue,bg=default,reverse,fill=blue
set -g message-command-style fg=yellow,bg=default,reverse,fill=yellow
set -g menu-style fg=default,bg=default
set -g menu-selected-style fg=blue,bg=default,reverse,bold
set -g menu-border-style fg=blue
set -g menu-border-lines rounded

# These styles control display-popup. Scratch terminals use new-pane below.
set -g popup-style fg=default,bg=default
set -g popup-border-style fg=blue
set -g popup-border-lines rounded

# Clock mode is separate from the status bar clock.
set -g clock-mode-colour blue
set -g clock-mode-style 24

# Agent status -----------------------------------------------------------------

# Codex's terminal title comes from the client, including with its shared server.
# Match its activity spinner and action-required prefix; otherwise it is ready.
set -g @codex-status-color '#{?#{m/r:^(● )?\[ [!.] \] Action Required,#{pane_title}},red,#{?#{m/r:^(● )?[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},yellow,green}}'
# Claude hooks in tmux/agent-status.py set pane-local state. Hide it after exit
# or pane respawn by checking the stored process identity.
set -g @agent-status-color '#{?pane_dead,,#{?#{==:#{pane_current_command},codex},#{E:@codex-status-color},#{?#{&&:#{@agent_status},#{==:#{pane_pid}:#{pane_current_command},#{@agent_process}}},#{@agent_status},}}}'
# P: includes every agent pane, even when another pane has focus.
# Keep dots on the terminal background, including in the active window label.
set -g @agent-status-format '#{P:#{?#{E:@agent-status-color}, #[push-default]#[fg=#{E:@agent-status-color}]●#[default]#[pop-default],}}'
set -g @agent-pane-status-format '#{?#{E:@agent-status-color},#[push-default]#[fg=#{E:@agent-status-color}]●#[default]#[pop-default] ,}'

# Status bar -------------------------------------------------------------------

set -g status-position bottom
set -g status 2
set -g status-interval 1
set -g status-justify left
set -g status-left-length 28
set -g status-right-length 70

# Hide the session label inside scratch terminals. Outside, always show a grey
# launcher dot. Control0 covers only the dot and its padding for mouse bindings.
set -g status-left '#{?#{m:popup-*,#{session_name}},,#[fg=brightblack] #{=/17/...:session_name} │#[range=control|0 fg=themelightgrey nobold] ● #[range=left fg=brightblack]│#[default] }'

# Reset before appending so reloads do not duplicate the status segments.
set -g status-right '#{?client_prefix,#[fg=yellow bold] PREFIX #[default] ,}'
set -ag status-right '#{?#{==:#{pane_mode},copy-mode},#[fg=magenta bold] COPY #[default] ,}'
set -ag status-right '#{?window_zoomed_flag,#[fg=cyan bold] ZOOM #[default] ,}'
set -ag status-right '#[fg=themelightgrey,nobold] %H:%M #[default]'

# Padded window tabs. Hide active/last and modal markers; keep zoom and bell indicators.
set -g window-status-separator '#[fg=brightblack,nobold]│#[default]'
# Add one new-tab button after the last window. Control1 covers its padded +.
set -g @new-window-button '#[fg=brightblack nobold]│#[range=control|1 fg=themelightgrey nobold] + #[norange default]'
set -g window-status-format ' #I#{E:@agent-status-format} #W#{s/[*O-]//:window_flags} #{?loop_last_flag,#{E:@new-window-button},}'
set -g window-status-current-format '#{E:window-status-format}'

# Keep the standard tab layout below a full-width divider. Reset before copying
# so reloading this file cannot replace the tabs with a second divider.
set -gu status-format
set -gF status-format[1] '#{status-format[0]}'
set -g status-format[0] '#[fg=brightblack,nobold]#{R:─,#{client_width}}'

# Pane labels ------------------------------------------------------------------

# Label split panes. Scratch terminals use only their outer floating border.
set -g pane-border-status off
# A modal floating shell does not count as a split in the parent window.
set -g @pane-label-position '#{?#{m:popup-*,#{session_name}},off,#{?#{>:#{window_panes},#{?window_modal_pane,2,1}},top,off}}'
set -g pane-border-format '#[bg=default]#{?pane_active,#[fg=terminal bold],#[fg=themelightgrey nobold]} #{E:@agent-pane-status-format}#{?#{n:@pane_label},#{q/h:@pane_label},#{pane_current_command}} #[default]'
set-hook -g window-layout-changed[pane-labels] {
    # Closing the last pane may remove the window before this queued hook runs.
    run -C 'set -wq -t #{hook_window} pane-border-status #{E:@pane-label-position}'
}
# Linking covers the first window of a session and each new tab.
set-hook -g window-linked[pane-labels] {
    run -C 'set -wq -t #{hook_window} pane-border-status #{E:@pane-label-position}'
}
# Also update existing windows when this file is loaded or reloaded.
run -C '#{S:#{W:set -wq -t #{window_id} pane-border-status #{E:@pane-label-position};}}'

# Copy mode and mouse selection ------------------------------------------------

# Use vi keys in copy mode.
set -g mode-keys vi
# Show the scrollbar in copy/view mode. Hide it after 0.5 seconds of inactivity.
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-timeout 500

# Word boundaries for double-click and vi-mode word motions.
set -g word-separators " '\"()[]{}<>|;:,./?\\~`!@#$%^&*+=\t\n"

# Copy and clear the selection. Keep copy mode and the current scroll position.
bind -N 'Copy selection and keep scroll position' -T copy-mode-vi y send-keys -X copy-selection \; display 'Copied!'

# Escape exits copy mode. The default vi binding only clears the selection.
bind -N 'Exit copy mode' -T copy-mode-vi Escape send-keys -X cancel

# Mouse selection always waits for y, including word and line selection.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -N 'Select a word and wait for y to copy' -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -N 'Select a line and wait for y to copy' -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -N 'Select a word or send the click to the application' -T root DoubleClick1Pane {
    select-pane -t =
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        copy-mode -H
        send-keys -X select-word
    }
}
bind -N 'Select a line or send the click to the application' -T root TripleClick1Pane {
    select-pane -t =
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        copy-mode -H
        send-keys -X select-line
    }
}

# Exit copy mode when the mouse wheel scrolls down past the bottom of history.
bind -N 'Scroll down and exit copy mode at the bottom' -T copy-mode-vi WheelDownPane {
    if -F "#{==:#{scroll_position},0}" {
        send-keys -X cancel
    } {
        send-keys -X -N 3 scroll-down
    }
}

# Prefix-/ searches up through history. Prefix-? searches down.
bind -N 'Search up through terminal history' / copy-mode \; send-keys ?
bind -N 'Search down through terminal history' ? copy-mode \; send-keys /

# Within copy mode, highlight matches as each character is entered.
bind -N 'Search down as text is entered' -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind -N 'Search up as text is entered' -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# Scratch terminals ------------------------------------------------------------

# Prefix-0 toggles a persistent session named by its parent's stable numeric ID.
# The floating pane holds only a client. Scratch terminals keep running in their
# own session when it closes. Status clicks stay accessible.
set-hook -g @popup-toggle {
    if -F '#{m:popup-*,#{session_name}}' {
        detach-client
    } {
        if -F '#{&&:#{pane_floating_flag},#{@popup-wrapper}}' {
            run -C 'detach-client -t "#{pane_tty}"'
        } {
            # Capture keyboard input for the inner session, including prefix.
            # Expand the ID/socket now; let new-pane expand the directory.
            # Floating panes have their own border styles, set here to blue.
            run -C 'new-pane -AOK -B single -S fg=blue -R fg=blue -x 80% -y 80% -X 10% -Y 10% -c "##{pane_current_path}" -e TMUX= tmux -S #{q:socket_path} new-session -A -s popup-#{s/[$]//:session_id}'
            set -p @popup-wrapper 1
            # Render the selected scratch pane's label in the outer border.
            # Capture its session name now; evaluate its process on each redraw.
            set -p pane-border-status top
            run -C 'set -p pane-border-format "##{S:##{?##{==:##{session_name},popup-#{s/[$]//:session_id}},##{E:pane-border-format},}}"'
        }
    }
}
# Clear the previous shortcut when this config is reloaded.
unbind -q g
bind -N 'Show or hide the persistent scratch terminal' 0 set-hook -gR @popup-toggle
# Control0 covers only the popup dot and its padding in status-left.
bind -N 'Show or hide the scratch terminal' -n MouseDown1Control0 set-hook -gR @popup-toggle
# Handle each press immediately, including rapid repeated clicks.
bind -N 'Toggle the scratch terminal on the second click' -n SecondClick1Control0 set-hook -gR @popup-toggle
bind -N 'Toggle the scratch terminal on the third click' -n TripleClick1Control0 set-hook -gR @popup-toggle

# Window and pane controls -----------------------------------------------------

# Show shortcut descriptions. Use u for usage.
# Clear the previous help key when this config is reloaded.
unbind -q b
bind -N 'Show shortcut descriptions' u list-keys -N

# Restart a pane only with a separate shortcut and explicit confirmation.
bind -N 'Restart the pane after confirmation' C-r confirm-before -p 'Stop and restart pane #P? (y/n)' {
    respawn-pane -k
    display 'Respawned Pane!'
}

# Reload the config.
bind -N 'Reload the tmux config' R source-file ~/.tmux.conf \; display 'Reloaded!'

# Name this pane's border label without changing its application title.
# Submit an empty name to return to the current process name.
# Clear pane-rename bindings from earlier versions on reload.
unbind -q N
unbind -q e
bind -N 'Rename the pane label; leave empty for the process name' r command-prompt -l -I '#{?#{n:@pane_label},#{@pane_label},#{pane_current_command}}' -p '(rename-pane) ' 'set -p @pane_label "%%%"'

# Keep the pane picker open until a key is pressed.
bind -N 'Show pane numbers until a pane is selected' Space display-panes -d 0

# Prefix-Tab selects the last window. Prefix-; still selects the last pane.
bind -N 'Select the last window' Tab last-window

# Select and resize panes with vi-style keys.
bind -N 'Select the pane on the left' h select-pane -L
bind -N 'Select the pane on the left' C-h select-pane -L
bind -N 'Select the pane below' j select-pane -D
bind -N 'Select the pane below' C-j select-pane -D
bind -N 'Select the pane above' k select-pane -U
bind -N 'Select the pane above' C-k select-pane -U
bind -N 'Select the pane on the right' l select-pane -R
bind -N 'Select the pane on the right' C-l select-pane -R
bind -N 'Resize the pane left by 5 columns' -r H resize-pane -L 5
bind -N 'Resize the pane down by 5 lines' -r J resize-pane -D 5
bind -N 'Resize the pane up by 5 lines' -r K resize-pane -U 5
bind -N 'Resize the pane right by 5 columns' -r L resize-pane -R 5

# Move windows and create panes/windows in the current directory.
# Keep both the standard split keys and the alternate split keys.
bind -N 'Move the window one position left' -r '<' swap-window -d -t -1
bind -N 'Move the window one position right' -r '>' swap-window -d -t +1
bind -N 'Split into panes side by side in the current directory' '|' split-window -h -c '#{pane_current_path}'
bind -N 'Split across the full window height in the current directory' '\' split-window -fh -c '#{pane_current_path}'
bind -N 'Split into panes above and below in the current directory' '-' split-window -v -c '#{pane_current_path}'
bind -N 'Split across the full window width in the current directory' '_' split-window -fv -c '#{pane_current_path}'
bind -N 'Split into panes side by side in the current directory' '%' split-window -h -c '#{pane_current_path}'
bind -N 'Split into panes above and below in the current directory' '"' split-window -v -c '#{pane_current_path}'
bind -N 'Create a window in the current directory' c new-window -c '#{pane_current_path}'
# Control1 is the + after the tabs. Handle every press, including rapid clicks.
bind -N 'Create a window in the current directory' -n MouseDown1Control1 new-window -c '#{pane_current_path}'
bind -N 'Create a window on the second click' -n SecondClick1Control1 new-window -c '#{pane_current_path}'
bind -N 'Create a window on the third click' -n TripleClick1Control1 new-window -c '#{pane_current_path}'
