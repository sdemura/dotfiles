# Truecolor: tmux-256color advertises capabilities; RGB override enables 24-bit.
# If `tmux-256color` is missing from terminfo: see https://gist.github.com/bbqtd/a4ac060d6f6b9ea6fe3aabe735aa9d95
set -g default-terminal "tmux-256color"
set -a terminal-overrides "*256col*:RGB"

# Tell tmux the terminal supports cursor shape (DECSCUSR), so the cursor stops
# getting stuck as a block when nvim/fzf/etc. exit without resetting.
set -as terminal-features ',*:cstyle'

set -g status-position bottom
set -g mouse on

# leave status messages on screen long enough to read
set -g display-time 2000

# pane numbers: rely on `-d 0` on the prefix-Space binding for "wait for keypress"
# (the global setting must be > 0; 60s is effectively forever for this purpose)
set -g display-panes-time 60000

# scrollback buffer
set -g history-limit 50000

# OSC 52 clipboard sync (replaces tmux-yank). Ghostty: set clipboard-write = allow
set -g set-clipboard on

# nvim: kill ESC lag and let FocusGained/FocusLost autocmds fire
set -s escape-time 0
set -g focus-events on

# let kitty-graphics / sixel escapes through tmux for image.nvim, snacks.image, etc.
set -g allow-passthrough on

# Use the terminal palette so Ghostty's light/dark theme switch also styles tmux.
# Reverse video gives badges a colored background and terminal-background text.
set -g status-style bg=default,fg=default
set -g status-justify left
set -g status-left-length 24
set -g status-left '#[fg=magenta,reverse,bold] #{=/17/...:session_name} #[default] '
set -g status-right-length 70

# Reset before appending so reloads do not duplicate the status segments.
set -g status-right '#{?client_prefix,#[fg=yellow reverse bold] PREFIX #[default] ,}'
set -ag status-right '#{?#{==:#{pane_mode},copy-mode},#[fg=magenta reverse bold] COPY #[default] ,}'
set -ag status-right '#{?window_zoomed_flag,#[fg=cyan reverse bold] ZOOM #[default] ,}'

# Padded window tabs. Keep flags for last-window, zoom, and bell indicators.
set -g window-status-separator ' '
# Agent hooks store pane-local labels. Hide them when the agent exits or the
# pane respawns. P: includes every agent pane, even when another pane has focus.
set -g @agent-status-format '#{P:#{?#{&&:#{@agent_status},#{==:#{pane_pid}:#{pane_current_command},#{@agent_process}}}, #{@agent_status},}}'
set -g window-status-format ' #I #W#F#{E:@agent-status-format} '
set -g window-status-current-format ' #I #W#F#{E:@agent-status-format} '
set -g window-status-style fg=blue,bg=default
set -g window-status-current-style fg=blue,bg=default,reverse,bold
set -g window-status-last-style fg=cyan
set -g window-status-activity-style fg=magenta,bold
set -g window-status-bell-style fg=red,bold

# panes
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=brightblack
set -g display-panes-colour "brightblack"
set -g display-panes-active-colour "blue"

# Copy selections, prompts, menus, and the floating shell share the same palette.
set -g mode-style fg=yellow,bg=default,reverse,bold
# tmux 3.8 overlays prompts on the status bar; fill clears the old labels.
set -g message-style fg=blue,bg=default,reverse,fill=blue
set -g message-command-style fg=yellow,bg=default,reverse,fill=yellow
set -g menu-style fg=default,bg=default
set -g menu-selected-style fg=blue,bg=default,reverse,bold
set -g menu-border-style fg=blue
set -g menu-border-lines rounded
set -g popup-style fg=default,bg=default
set -g popup-border-style fg=blue
set -g popup-border-lines rounded
setw -g clock-mode-colour blue
setw -g clock-mode-style 24

# respawn pane
bind-key r respawn-pane -k \; display 'Respawned Pane!'

# reload config
bind-key R source-file ~/.tmux.conf \; display 'Reloaded!'

# 1-indexed windows/panes, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# resize to smallest *attached* client, not smallest session member
setw -g aggressive-resize on

# vi copy mode
setw -g mode-keys vi

# y: copy + clear selection, stay in copy mode (clipboard sync via set-clipboard)
bind-key -T copy-mode-vi y send-keys -X copy-selection \; display 'Copied!'

# Escape exits copy mode (default vi binding only clears the selection)
bind-key -T copy-mode-vi Escape send-keys -X cancel

# mouse drag-release: do NOT copy — just leave the selection on screen.
# (default binding copies and cancels; we want explicit `y` to copy.)
unbind -T copy-mode-vi MouseDragEnd1Pane

# wheel down past the bottom of scrollback → exit copy mode
bind-key -T copy-mode-vi WheelDownPane {
    if-shell -F "#{==:#{scroll_position},0}" {
        send-keys -X cancel
    } {
        send-keys -X -N 3 scroll-down
    }
}

# incremental search: highlight matches as you type
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# pane picker on prefix-Space (no auto-dismiss)
unbind Space
bind -T prefix Space display-panes -d 0

# prefix-Tab: jump to last window (default is prefix-l; prefix-; still does last pane)
bind Tab last-window

# prefix-g: toggleable floating shell. Each root session gets its own popup
# session named `popup-<root>`. Inside the popup, prefix-g dismisses it.
bind g if -F '#{m:popup-*,#{session_name}}' \
    'detach-client' \
    'display-popup -d "#{q:pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup-#{q:session_name}"'

# scrollback search: prefix-/ goes up into history (common case), prefix-? goes down
bind / copy-mode \; send-keys ?
bind ? copy-mode \; send-keys /

# window titles
set -g set-titles on
set -g set-titles-string "#{session_name} [#{b:pane_current_path} #{window_index} #W]"

# word boundaries for double-click / vi-mode word motions
set -g word-separators " '\"()[]{}<>|;:,./?\\~`!@#$%^&*+=\t\n"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Keep this line at the very bottom of tmux.conf
run -b '~/.tmux/plugins/tpm/tpm'
