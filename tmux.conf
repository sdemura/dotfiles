# Advertise tmux capabilities to programs running inside it.
# If `tmux-256color` is missing from terminfo: see https://gist.github.com/bbqtd/a4ac060d6f6b9ea6fe3aabe735aa9d95
set -g default-terminal "tmux-256color"
# Fixed slots preserve tmux's defaults and avoid duplicates on reload.
# Cursor-shape support prevents a stuck block cursor after nvim/fzf exit.
set -s terminal-features[10] 'xterm-ghostty:RGB:cstyle'
set -s terminal-features[11] '*256col*:RGB'

set -g status-position bottom
set -g status 2
set -g status-interval 1
set -g mouse on

# leave status messages on screen long enough to read
set -g display-time 2000

# prefix-q shows pane numbers briefly; prefix-Space waits for a key with -d 0.
set -g display-panes-time 1000

# scrollback buffer
set -g history-limit 50000

# OSC 52 clipboard sync (replaces tmux-yank). Ghostty: set clipboard-write = allow
set -g set-clipboard on

# nvim: kill ESC lag and let FocusGained/FocusLost autocmds fire
set -s escape-time 0
set -g focus-events on

# let kitty-graphics / sixel escapes through tmux for image.nvim, snacks.image, etc.
set -g allow-passthrough on

# Use the terminal palette so Ghostty's light/dark theme switch also styles tmux.
# Keep the bar flat, with bold active labels and colored agent states.
set -g status-style bg=default,fg=default
set -g status-justify left
set -g status-left-length 28
# Hide the session label inside popups. Outside, a grey dot marks a popup
# that still has running terminals, including when it is hidden.
set -g status-left '#{?#{m:popup-*,#{session_name}},,#[fg=brightblack] #{=/17/...:session_name} │#{?#{N/s:popup-#{s/[$]//:session_id}},#[fg=themelightgrey nobold] ● #[fg=brightblack]│,}#[default] }'
set -g status-right-length 70

# Reset before appending so reloads do not duplicate the status segments.
set -g status-right '#{?client_prefix,#[fg=yellow bold] PREFIX #[default] ,}'
set -ag status-right '#{?#{==:#{pane_mode},copy-mode},#[fg=magenta bold] COPY #[default] ,}'
set -ag status-right '#{?window_zoomed_flag,#[fg=cyan bold] ZOOM #[default] ,}'
set -ag status-right '#[fg=themelightgrey,nobold] %H:%M #[default]'

# Padded window tabs. Hide active/last markers; keep zoom and bell indicators.
set -g window-status-separator '#[fg=brightblack,nobold]│#[default]'
# Codex's terminal title comes from the client, including with its shared server.
# Match its activity spinner and action-required prefix; otherwise it is ready.
set -g @codex-status-color '#{?#{m/r:^(● )?\[ [!.] \] Action Required,#{pane_title}},red,#{?#{m/r:^(● )?[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}},yellow,green}}'
# Other agents use pane-local hook state. Hide it after exit or pane respawn.
set -g @agent-status-color '#{?pane_dead,,#{?#{==:#{pane_current_command},codex},#{E:@codex-status-color},#{?#{&&:#{@agent_status},#{==:#{pane_pid}:#{pane_current_command},#{@agent_process}}},#{@agent_status},}}}'
# P: includes every agent pane, even when another pane has focus.
# Keep dots on the terminal background, including in the active window label.
set -g @agent-status-format '#{P:#{?#{E:@agent-status-color}, #[push-default]#[fg=#{E:@agent-status-color}]●#[default]#[pop-default],}}'
set -g window-status-format ' #I#{E:@agent-status-format} #W#{s/[*-]//:window_flags} '
set -g window-status-current-format '#{E:window-status-format}'
# Catppuccin Overlay1 gives inactive labels a middle gray in either theme.
set -s dark-theme-light-grey '#8087a2'
set -s light-theme-light-grey '#8c8fa1'
set -g window-status-style fg=themelightgrey,bg=default
set -g window-status-current-style fg=default,bg=default,bold
set -g window-status-last-style fg=themelightgrey
set -g window-status-activity-style fg=magenta,bold
set -g window-status-bell-style fg=red,bold

# Keep the standard tab layout below a full-width divider. Reset before copying
# so reloading this file cannot replace the tabs with a second divider.
set -gu status-format
set -gF status-format[1] '#{status-format[0]}'
set -g status-format[0] '#[fg=brightblack,nobold]#{R:─,#{client_width}}'

# panes
set -g pane-border-lines heavy
set -g pane-active-border-style fg=blue
set -g pane-border-style fg=brightblack
# Label split panes and every popup pane on their top border.
set -g pane-border-status off
set -g @pane-label-position '#{?#{||:#{m:popup-*,#{session_name}},#{>:#{window_panes},1}},top,off}'
set -g @agent-pane-status-format '#{?#{E:@agent-status-color},#[push-default]#[fg=#{E:@agent-status-color}]●#[default]#[pop-default] ,}'
set -g pane-border-format '#[bg=default]#{?pane_active,#[fg=terminal bold],#[fg=themelightgrey nobold]} #{E:@agent-pane-status-format}#{?#{n:@pane_label},#{q/h:@pane_label},#{pane_current_command}} #[default]'
set-hook -g window-layout-changed[pane-labels] {
    # Closing the last pane may remove the window before this queued hook runs.
    run -C 'set -wq -t #{hook_window} pane-border-status #{E:@pane-label-position}'
}
# Linking covers the first window of a session and each new tab.
set-hook -g window-linked[pane-labels] {
    run -C 'set -wq -t #{hook_window} pane-border-status #{E:@pane-label-position}'
}
# Also update existing windows when this file is loaded or reloaded.
run -C '#{S:#{W:set -wq -t #{window_id} pane-border-status #{E:@pane-label-position};}}'
set -g display-panes-colour "brightblack"
set -g display-panes-active-colour "blue"

# Copy selections, prompts, menus, and the floating shell share the same palette.
set -g mode-style fg=yellow,bg=default,reverse,bold
# tmux 3.8 overlays prompts on the status bar; fill clears the old labels.
set -g message-style fg=blue,bg=default,reverse,fill=blue
set -g message-command-style fg=yellow,bg=default,reverse,fill=yellow
set -g menu-style fg=default,bg=default
set -g menu-selected-style fg=blue,bg=default,reverse,bold
set -g menu-border-style fg=blue
set -g menu-border-lines rounded
set -g popup-style fg=default,bg=default
set -g popup-border-style fg=blue
set -g popup-border-lines rounded
setw -g clock-mode-colour blue
setw -g clock-mode-style 24

# Restart a pane only with a separate shortcut and explicit confirmation.
bind-key C-r confirm-before -p 'Stop and restart pane #P? (y/n)' {
    respawn-pane -k
    display 'Respawned Pane!'
}

# reload config
bind-key R source-file ~/.tmux.conf \; display 'Reloaded!'

# 1-indexed windows/panes, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Resize using sessions where the window is current. The default window-size
# policy, latest, follows the client with the most recent activity.
setw -g aggressive-resize on

# vi copy mode
setw -g mode-keys vi

# y: copy + clear selection, stay in copy mode (clipboard sync via set-clipboard)
bind-key -T copy-mode-vi y send-keys -X copy-selection \; display 'Copied!'

# Escape exits copy mode (default vi binding only clears the selection)
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Mouse selection always waits for y, including word and line selection.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -T root DoubleClick1Pane {
    select-pane -t =
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        copy-mode -H
        send-keys -X select-word
    }
}
bind -T root TripleClick1Pane {
    select-pane -t =
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        copy-mode -H
        send-keys -X select-line
    }
}

# wheel down past the bottom of scrollback → exit copy mode
bind-key -T copy-mode-vi WheelDownPane {
    if-shell -F "#{==:#{scroll_position},0}" {
        send-keys -X cancel
    } {
        send-keys -X -N 3 scroll-down
    }
}

# incremental search: highlight matches as you type
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# pane picker on prefix-Space (no auto-dismiss)
unbind Space
bind -T prefix Space display-panes -d 0

# Name this pane's border label without changing its application title.
# Submit an empty name to return to the current process name.
unbind -q N
unbind -q e
bind r command-prompt -l -I '#{?#{n:@pane_label},#{@pane_label},#{pane_current_command}}' -p '(rename-pane) ' 'set -p @pane_label "%%%"'

# prefix-Tab: jump to last window; prefix-; still selects the last pane.
bind Tab last-window

# prefix-g: toggle a persistent floating session, named by its parent's stable
# numeric session ID. Parent renames keep the same popup. Inside it, dismiss.
bind g if -F '#{m:popup-*,#{session_name}}' {
    detach-client
} {
    # Expand the ID now; let display-popup expand the directory itself.
    run -C 'display-popup -d "##{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s popup-#{s/[$]//:session_id}"'
}

# scrollback search: prefix-/ goes up into history (common case), prefix-? goes down
bind / copy-mode \; send-keys ?
bind ? copy-mode \; send-keys /

# window titles
set -g set-titles on
set -g set-titles-string "#{session_name} [#{b:pane_current_path} #{window_index} #W]"

# word boundaries for double-click / vi-mode word motions
set -g word-separators " '\"()[]{}<>|;:,./?\\~`!@#$%^&*+=\t\n"

# Pane navigation, resizing, and splits. Keep all shortcuts here.
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1
bind '|' split-window -h -c '#{pane_current_path}'
bind '\' split-window -fh -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind '_' split-window -fv -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
