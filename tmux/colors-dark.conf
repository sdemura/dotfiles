# Catppuccin Macchiato colors for tmux
# Status bar
set -g status-style bg=default,fg="#8aadf4"
# Inactive window
set -g window-status-style fg="#8aadf4"
# Active window
set -g window-status-current-style fg="#eed49f",bold,bg=default
# Split borders
set -g pane-active-border-style fg="#8aadf4"
set -g pane-border-style fg="#5b6078"
# Highlight / copy mode
set -g mode-style bg="#8aadf4",fg="#24273a",bold
# Messages
set -g message-style bg="#363a4f",fg="#cad3f5"
# Pane number display
set -g display-panes-colour "#5b6078"
set -g display-panes-active-colour "#cad3f5"
