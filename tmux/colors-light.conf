# Catppuccin Latte colors for tmux
# Status bar
set -g status-style bg=default,fg="#1e66f5"
# Inactive window
set -g window-status-style fg="#1e66f5"
# Active window
set -g window-status-current-style fg="#df8e1d",bold,bg=default
# Split borders
set -g pane-active-border-style fg="#1e66f5"
set -g pane-border-style fg="#acb0be"
# Highlight / copy mode
set -g mode-style bg="#1e66f5",fg="#eff1f5",bold
# Messages
set -g message-style bg="#dce0e8",fg="#4c4f69"
# Pane number display
set -g display-panes-colour "#acb0be"
set -g display-panes-active-colour "#4c4f69"
